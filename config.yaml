    plot_thread_merger: cloud_qwen_max_thinking
    character_disambiguator: cloud_qwen_max_thinking
    timeline_entry_merger: cloud_qwen_max_thinking
    style_auditor: cloud_qwen_max_low_thinking
    mechanism_consistency_validator: cloud_qwen_max_thinking
    thread_closure_validator: cloud_qwen_max_thinking
    identity_coverage_validator: cloud_qwen_max_thinking
    setting_consistency_validator: cloud_qwen_max_thinking
    scene_anchor_validator: cloud_qwen_max_thinking
