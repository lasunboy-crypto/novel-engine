# ===========================================================
# 成本守卫(P4-B-08 引入)
# ===========================================================
#
# 对齐 OBSERVABILITY §3.4 字面字段。
# 加载入口:src/services/cost_guard.py:load_cost_guard_config
# 单元判定:src/services/cost_guard.py:evaluate_cost_guard
#
# 维护人无 Claude API key 默认走本地 Qwen(cost=0),阈值仅在切到 claude
# profile 或导入历史 metrics 时才会命中;**默认值留宽**,真实超限场景由
# P4-acceptance 真 LLM 验收触发。
#
# 字段说明:
# - daily_usd_limit            : 全工作区合计单日上限(美元;跨工作区聚合
#                                留观未接,当前恒传 0.0 不触发)
# - monthly_usd_limit          : 全工作区合计单月上限(美元;同上留观)
# - per_workspace_daily_limit  : 单工作区成本上限(美元)。
#                                ⚠️ v2 w2-s2 metrics 修复 B 起语义 = **本书
#                                累计成本上限**(读数源 SUM(chapters.
#                                total_cost_usd) 真值账,非当日;字段名保留
#                                "daily" 为工作区 yaml 覆盖向后兼容)。
#                                30.0 = 30 章书实测 ~$18(run-accept-v1)×
#                                1.5 余量;w4 跑 50-100 章前按实测再调。
# - action_on_exceed           : 触发后行为 — pause | warn | continue
#                                pause:推 system.alerts + caller 暂停新流水线
#                                warn :推 system.alerts + 日志告警 + 继续
#                                continue:仅日志(不推 WS,不暂停)
# - notify_via                 : 通知通道列表 — log | websocket(空列表禁用通知)

cost_guard:
  cost_currency: USD             # legacy *_usd_limit 字段按此币种解释；不自动换汇
  daily_usd_limit: 20.0
  monthly_usd_limit: 300.0
  per_workspace_daily_limit: 30.0
  action_on_exceed: pause
  notify_via: [log, websocket]


# ===========================================================
# 流水线 Run 配置(v2 w1-s3 引入)
# ===========================================================
#
# 加载入口:src/services/pipeline_service.py:load_pipeline_watchdog_config
# 数据模型:src/services/pipeline_service.py:PipelineWatchdogConfig
#
# 字段说明:
# - chapter_timeout_seconds : 章级看门狗预算(秒)。批量 Run 中单章处理
#   (含写前卡生成 + 写章全链路 ~11-13 次串行 LLM 调用)超过该时长 →
#   watchdog 把 run 标 interrupted(reason=chapter_watchdog_timeout),
#   章自然留非终态由启动期 reset_stale 自愈。默认 2400(40min,
#   ≈13 调用 × 600s 单调用超时的保守折算);<= 0 表示禁用看门狗。
#   不强杀写章线程(Python 线程不可安全强杀)— 只标记可见 + 可 resume。

pipeline:
  chapter_timeout_seconds: 2400


