# 引擎默认 LLM Profile + Routing 配置(P3-B-01 引入)
# ====================================================
#
# 加载入口:src/core/config_loader.py:load_writer_profiles_config
# 数据模型:src/core/models/writer_profile.py:WriterProfile
#          src/core/models/routing.py:RoutingConfig + WriterProfilesConfig
#
# 三层配置覆盖顺序(对齐 PROJECT_SPEC §10.1):
# 1. 引擎默认:本文件
# 2. 工作区覆盖:workspaces/<name>/project.yaml(P3-B-02 service 层叠加)
# 3. 运行时覆盖:CLI / API 参数 / WriterProfileSelector(P3-F-03)
#
# 维护人环境约束(P3-plan §"维护人环境约束"):
# - 维护人无 Claude API key,默认走本地 ollama qwen-novel
# - cloud_quality / cloud_premium profile 完整定义但不作为 default
# - 路由规则 arc_finale / tension>=9 升级 cloud_premium 仅在有 API key 时生效

# POST-V8 S2-0R 单模型活动配置。维护人未来只改 active 一行选择一臂；null 表示
# 当前没有获批的 Provider 活动。三份 manifest 都是 Provider-0 冻结配置；
# selection_test 下的 max_physical_requests/max_configured_rmb 只供未来专用
# 三模型选型 runner 使用，是维护人愿意承担的最大损失熔断值，不是费用预测，
# 不保证活动完成，也绝不成为普通 UI/正式生产 Run 的费用上限。当前必须为
# 0/0，且 active 必须为 null。
# 工作区 project.yaml、agent route、force_profile 与 default fallback 均无权
# 覆盖本段。
run_model_manifest:
  active: null
  manifests:
    hy3:
      manifest_id: hy3
      provider_authority: tencent_tokenhub
      base_url: https://tokenhub.tencentmaas.com/v1
      host: tokenhub.tencentmaas.com
      region: ap-guangzhou
      workspace_authority_id: tencent-tokenhub-ap-guangzhou
      exact_model_id: hy3
      credential_source_id: tokenhub_api_key
      transport: openai_chat_completions
      completion_limit_wire_field: max_completion_tokens
      structured_mode: native_json_schema_strict
      structured_schema_dialect: tokenhub_hy3_chat_json_schema_v1
      context_window: 256000
      tiers:
        low:
          provider_input_guard_tokens: 131072
          max_completion_tokens: 12096
          temperature: 0.7
          thinking_request:
            thinking: {type: enabled, budget_tokens: 4096}
            reasoning_effort: low
        medium:
          provider_input_guard_tokens: 192000
          max_completion_tokens: 24384
          temperature: 0.7
          thinking_request:
            thinking: {type: enabled, budget_tokens: 16384}
            reasoning_effort: medium
        xhigh:
          provider_input_guard_tokens: 192000
          max_completion_tokens: 40768
          temperature: 0.7
          thinking_request:
            thinking: {type: enabled, budget_tokens: 32768}
            reasoning_effort: high
      input_price_rmb_per_million: 1
      output_price_rmb_per_million: 4
      cache_billing_policy: no_discount
      selection_test:
        activity_scope: selection_test
        max_physical_requests: 0
        max_configured_rmb: 0
      fallback: false

    deepseek-v4-flash:
      manifest_id: deepseek-v4-flash
      provider_authority: deepseek_official
      base_url: https://api.deepseek.com
      host: api.deepseek.com
      region: deepseek-official-api
      workspace_authority_id: deepseek-official-account
      exact_model_id: deepseek-v4-flash
      credential_source_id: deepseek_api_key
      transport: openai_chat_completions
      completion_limit_wire_field: max_tokens
      structured_mode: json_object_local_schema
      context_window: 1000000
      tiers:
        low:
          provider_input_guard_tokens: 131072
          max_completion_tokens: 12096
          temperature: null
          thinking_request:
            thinking: {type: enabled}
            reasoning_effort: low
        medium:
          provider_input_guard_tokens: 524288
          max_completion_tokens: 24384
          temperature: null
          thinking_request:
            thinking: {type: enabled}
            reasoning_effort: high
        xhigh:
          provider_input_guard_tokens: 524288
          max_completion_tokens: 40768
          temperature: null
          thinking_request:
            thinking: {type: enabled}
            reasoning_effort: max
      # 2026-08-28 DeepSeek 官网运行日峰值普通实时价；selection-test
      # 一律按峰值且不计缓存优惠，不能沿用 S2-0 的历史 ¥1/¥2 基准。
      input_price_rmb_per_million: 3
      output_price_rmb_per_million: 9
      cache_billing_policy: no_discount
      selection_test:
        activity_scope: selection_test
        max_physical_requests: 0
        max_configured_rmb: 0
      fallback: false

    qwen3.8-27b:
      manifest_id: qwen3.8-27b
      provider_authority: alibaba_model_studio
      # 北京公共 DashScope 域名仍获官方支持，并兼容同地域业务空间 API Key。
      # 本次选择测试沿用项目既有地址，不要求控制台登录或 workspace ID。
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      host: dashscope.aliyuncs.com
      region: cn-beijing
      workspace_authority_id: alibaba-dashscope-cn-beijing-public
      exact_model_id: qwen3.8-27b
      credential_source_id: dashscope_api_key
      transport: openai_chat_completions
      completion_limit_wire_field: max_completion_tokens
      structured_mode: json_object_local_schema
      context_window: 1000000
      tiers:
        low:
          provider_input_guard_tokens: 131072
          max_completion_tokens: 12096
          temperature: 0.7
          thinking_request:
            enable_thinking: true
            thinking_budget: 4096
            preserve_thinking: false
        medium:
          provider_input_guard_tokens: 524288
          max_completion_tokens: 24384
          temperature: 0.7
          thinking_request:
            enable_thinking: true
            thinking_budget: 16384
            preserve_thinking: false
        xhigh:
          provider_input_guard_tokens: 524288
          max_completion_tokens: 40768
          temperature: 0.7
          thinking_request:
            enable_thinking: true
            thinking_budget: 32768
            preserve_thinking: false
      input_price_rmb_per_million: 3
      output_price_rmb_per_million: 12
      cache_billing_policy: no_discount
      selection_test:
        activity_scope: selection_test
        max_physical_requests: 0
        max_configured_rmb: 0
      fallback: false


writer_profiles:

  # 本地 Qwen 主力 profile(P3 默认)
  # 对应 docs/local_llm_config.md:qwen-novel(基于 qwen3.5:35b),
  # ollama 原生 API + think:false 顶层参数(P3-plan 决策 6 选 A)
  local_qwen_32k:
    provider: ollama
    model: qwen-novel
    base_url: http://localhost:11434
    context_window: 24576       # 对齐 docs/modelfiles/qwen-novel.modelfile num_ctx 24576
    generation_params:
      temperature: 0.7
      num_predict: 4096          # ollama 字段名(对应 OpenAI max_tokens)
    extra_request_kwargs:
      think: false               # ollama 原生扩展,关闭 thinking mode
    cost_per_1k_input: 0.0       # 本地推理无 API 成本
    cost_per_1k_output: 0.0
    cost_currency: USD
    notes: "P3 默认 profile;本地 ollama qwen-novel,think:false"

  # 本地 Qwen 短上下文 profile(供 MemoryExtractor / continuity / reranker 节省 KV cache)
  local_qwen_safe:
    provider: ollama
    model: qwen-novel
    base_url: http://localhost:11434
    context_window: 16000
    generation_params:
      temperature: 0.5
      num_predict: 2048
    extra_request_kwargs:
      think: false
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    cost_currency: USD
    notes: "短上下文 profile,供 MemoryExtractor / continuity 等结构化输出 agent"

  # 本地 Qwen 低温审稿 profile(P7-B-06 引入,供 Reviewer + must_achieve_validator)
  # 与 local_qwen_safe 的区别:温度 0.3(更稳)而非 0.5,专给 Reviewer 6 维度打分 +
  # must_achieve 独立 yes/no 这类"结果稳定性敏感"任务用。
  # P7-acceptance-rerun2 实测 reviewer 复用 local_qwen_32k(temp=0.7)导致评分抖动
  # 3.55-9.175 区间;切到 temp=0.3 后期望抖动收敛(实证留 P7-B-06 实证会话)。
  local_qwen_reviewer:
    provider: ollama
    model: qwen-novel
    base_url: http://localhost:11434
    context_window: 16000
    generation_params:
      temperature: 0.3
      num_predict: 2048
    extra_request_kwargs:
      think: false
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    cost_currency: USD
    notes: "P7-B-06 引入,Reviewer + must_achieve_validator 低温稳分专用 profile"

  # 云端高质量 profile(对齐 PROJECT_SPEC §7 字面)
  cloud_quality:
    provider: claude
    model: claude-sonnet-4-6
    context_window: 200000
    generation_params:
      temperature: 0.85
      max_tokens: 6000
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
    cost_currency: USD
    notes: "Claude Sonnet 4.6,云端默认质量;维护人无 API key 时不会被路由命中"

  # 云端最高质量 profile(arc_finale / 高张力章升级)
  cloud_premium:
    provider: claude
    model: claude-opus-4-7
    context_window: 200000
    generation_params:
      temperature: 0.85
      max_tokens: 8000
    cost_per_1k_input: 0.015
    cost_per_1k_output: 0.075
    cost_currency: USD
    notes: "Claude Opus 4.7,arc_finale / tension>=9 升级路径;P3 维护人本机不实跑"

  # 云端通义千问 qwen3.8-max 中等思考 profile。thinking_budget 与
  # input_token_budget 都是显式、有界预算；后者只由本地 client 预检消费，
  # 不会发给 Provider，也不会截断 prompt。
  # 费用口径（2026-08-23 按维护人价格截图复核）：当前生产走实时流式
  # /chat/completions，不是 Batch Chat / Batch File，因此限时 5 折的
  # ¥6/¥18 每百万 token 不适用。无免费额度时仍按普通输入 ¥12/百万、输出
  # ¥36/百万作 configured safety estimate；缓存命中量未被 Provider usage
  # 明确返回前，不预扣缓存优惠。
  # 通过 OpenAICompatibleClient 走 dashscope OpenAI 兼容 API + SSE stream
  # + reasoning_content 拆分(思考内容只入 structlog 不入 message_history)
  # 主仓 .env 需配 DASHSCOPE_API_KEY;不命中此 profile 时不消耗 key
  cloud_qwen_max_thinking:
    provider: openai_compatible
    model: qwen3.8-max
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    context_window: 1000000
    generation_params:
      temperature: 0.7
      max_tokens: 8000
    extra_request_kwargs:
      enable_thinking: true
      preserve_thinking: false   # 3.8 provider 默认 true；显式关掉以保持既有无思维链历史行为
      thinking_budget: 16384
      input_token_budget: 524288
    cost_per_1k_input: 0.012     # 普通实时输入 ¥12/百万；无免费额、不预支缓存/Batch 折扣
    cost_per_1k_output: 0.036    # 普通实时输出 ¥36/百万；Batch Chat 限时 5 折不适用
    cost_currency: RMB
    notes: "qwen3.8-max + medium thinking(16K) + 512K local input guard + preserve_thinking off;给复杂语义 Judge/出卡用"

  # 兼容用 standard profile：继续显式关闭 thinking，供历史工作区/手工覆盖解析。
  # 当前生产 agent_routing 不引用它；机械 trim 在 active Writer profile 上做
  # 单次 enable_thinking=false 覆盖，不靠本 profile 偷换 Writer 路由。
  cloud_qwen_max_standard:
    provider: openai_compatible
    model: qwen3.8-max
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    context_window: 1000000
    generation_params:
      temperature: 0.85
      max_tokens: 8000
    extra_request_kwargs:
      enable_thinking: false
      preserve_thinking: false
      input_token_budget: 524288
    cost_per_1k_input: 0.012
    cost_per_1k_output: 0.036
    cost_currency: RMB
    notes: "兼容 profile;qwen3.8-max thinking off + 512K local input guard + preserve_thinking off;当前生产路由不引用"

  # Writer/Reviser/MemoryExtractor 保留原 0.85 温度，但开启中等思考。
  cloud_qwen_max_medium_creative:
    provider: openai_compatible
    model: qwen3.8-max
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    context_window: 1000000
    generation_params:
      temperature: 0.85
      max_tokens: 8000
    extra_request_kwargs:
      enable_thinking: true
      preserve_thinking: false
      thinking_budget: 16384
      input_token_budget: 524288
    cost_per_1k_input: 0.012
    cost_per_1k_output: 0.036
    cost_currency: RMB
    notes: "qwen3.8-max + medium thinking(16K) + 512K local input guard;Writer/Reviser/MemoryExtractor 原温度 0.85"

  # 全书规划与 mini plan：当前保守输入峰值约 50.6K，512K guard 留约 10 倍余量。
  cloud_qwen_max_xhigh:
    provider: openai_compatible
    model: qwen3.8-max
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    context_window: 1000000
    generation_params:
      temperature: 0.7
      max_tokens: 8000
    extra_request_kwargs:
      enable_thinking: true
      preserve_thinking: false
      thinking_budget: 32768
      input_token_budget: 524288
    cost_per_1k_input: 0.012
    cost_per_1k_output: 0.036
    cost_currency: RMB
    notes: "qwen3.8-max + bounded xhigh thinking(32K) + 512K local input guard;给 outline_builder/mini_plan_generator 用"

  # 轻量语义检查：保留原 0.7 温度，4K 思考足够做窄判定；128K guard 覆盖
  # 当前最高约 24.1K 的保守输入上界至少 5.4 倍。
  cloud_qwen_max_low_thinking:
    provider: openai_compatible
    model: qwen3.8-max
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    context_window: 1000000
    generation_params:
      temperature: 0.7
      max_tokens: 8000
    extra_request_kwargs:
      enable_thinking: true
      preserve_thinking: false
      thinking_budget: 4096
      input_token_budget: 131072
    cost_per_1k_input: 0.012
    cost_per_1k_output: 0.036
    cost_currency: RMB
    notes: "qwen3.8-max + low thinking(4K) + 128K local input guard;给窄语义 validator/auditor 用"

  # 轻量抽取/检索保持原 0.85 温度，仅新增 4K 思考防长提示漏项。
  cloud_qwen_max_low_standard:
    provider: openai_compatible
    model: qwen3.8-max
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    context_window: 1000000
    generation_params:
      temperature: 0.85
      max_tokens: 8000
    extra_request_kwargs:
      enable_thinking: true
      preserve_thinking: false
      thinking_budget: 4096
      input_token_budget: 131072
    cost_per_1k_input: 0.012
    cost_per_1k_output: 0.036
    cost_currency: RMB
    notes: "qwen3.8-max + low thinking(4K) + 128K local input guard;给 continuity/reranker/chapter_summary_extractor 用"

  # PARKED / 历史实验资产(v2 W3.5 任务A,2026-07-04):
  # DeepSeek profile 保留给旧 acceptance、旧测试、成本标定和后续离线对照解析;
  # **生产 agent_routing 不再引用 cloud_deepseek_***。原因:v5 主流程第 4 章已暂停为
  # ``chapter_escalated / rewrite_budget_exhausted``,DeepSeek 在硬约束密集长篇主链路中
  # 持续破坏 must/forbidden/setting/style 等约束。回退 Qwen 是恢复可控性,不代表质量验收。
  # enable_thinking=false 对齐历史 OFF 基线 cloud_qwen_max_standard;reasoning 模型必须显式
  # 关 thinking,否则可能输出思考链污染正文。
  # ⚠️ caveat:deepseek-v3 系 2026-07-09 在百炼退役;v4-pro 在线可用,退役另议迁移。
  # cost_per_1k:**已落真实定价**(维护人 2026-06-15 百炼控制台确认 = 输入 ¥3 / 输出
  #   ¥6 每百万 tokens RMB)→ 换算 USD/1k(÷ 汇率 ~7.2):in ¥0.003/1k ÷7.2 ≈ 0.00042 /
  #   out ¥0.006/1k ÷7.2 ≈ 0.00083。比原占位 0.004/0.012 低约 10x —— deepseek 其实很
  #   便宜,利好 w4-s1 大跑 cost_guard 准确度(原占位会高估成本 10x)。
  cloud_deepseek_v4_pro:
    provider: openai_compatible
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com   # v2 W3.5-S3(2026-06-24):deepseek 切官网 endpoint(key 由 factory 按 base_url 选 deepseek_api_key;qwen 仍 dashscope)
    # 真实规格(维护人 2026-06-16 百炼控制台截图核实):最大输入/上下文 1M、最大输出
    # 384K、RPM 15000 / TPM 1.2M。W3.5-s2 修正 s1 初稿占位错值 131072→1000000(对齐 1M);
    # 输出上限 384K ≫ 当前 qwen 128K；此处只保留冻结历史规格对照。
    context_window: 1000000
    generation_params:
      temperature: 0.85          # healing/各风格走 router 路径时被 style_template 温度覆盖
      max_tokens: 8000           # ≤5000 字目标(~5000 输出 token)+ 充足收尾余量;不设更低防中途截断(控长度靠 writer.md v12 prompt + word_count 硬闸,非 max_tokens 硬截)
    extra_request_kwargs:
      enable_thinking: false     # deepseek-v4-pro 是 reasoning 模型,必须显式关 thinking(否则输出思考链污染正文 + 浪费 token)
    cost_per_1k_input: 0.00042   # 真实定价 ¥3/百万 ÷7.2(百炼 RMB,维护人 2026-06-15 确认)
    cost_per_1k_output: 0.00083  # 真实定价 ¥6/百万 ÷7.2
    cost_currency: USD           # 上述数值已经按注释汇率换算为 USD
    notes: "PARKED历史实验资产;生产agent_routing不引用cloud_deepseek_*;thinking off;镜像cloud_qwen_max_standard。真实规格 输入/上下文1M / 输出384K(百炼2026-06-16)"

  # PARKED / 历史实验资产:DeepSeek thinking profile 镜像 cloud_qwen_max_thinking,
  # 保留用于旧数据解析和离线对照;生产 judge/outline/card/reviewer 均回
  # cloud_qwen_max_thinking。
  cloud_deepseek_v4_pro_thinking:
    provider: openai_compatible
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com   # v2 W3.5-S3(2026-06-24):deepseek 切官网 endpoint(key 由 factory 按 base_url 选 deepseek_api_key;qwen 仍 dashscope)
    context_window: 1000000      # 真实 1M(百炼 2026-06-16);同 cloud_deepseek_v4_pro
    generation_params:
      temperature: 0.7           # 镜像 cloud_qwen_max_thinking(非 standard 的 0.85)
      max_tokens: 8000
    extra_request_kwargs:
      enable_thinking: true      # 镜像 qwen_thinking;judge 硬护栏要求 thinking on
    cost_per_1k_input: 0.00042   # 同 cloud_deepseek_v4_pro 真实定价 ¥3/百万 ÷7.2
    cost_per_1k_output: 0.00083  # ¥6/百万 ÷7.2
    cost_currency: USD           # 上述数值已经按注释汇率换算为 USD
    notes: "PARKED历史实验资产;生产agent_routing不引用cloud_deepseek_*;thinking on;镜像cloud_qwen_max_thinking"

  # mock profile,LLM_PROVIDER=mock 时所有路由命中本 profile
  # cost = 0,model_used 拼装时挂 ``mock-`` 前缀(由 MockLLMClient 处理)
  mock_default:
    provider: mock
    model: mock-default
    context_window: 16000
    generation_params: {}
    extra_request_kwargs: {}
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    cost_currency: USD
    notes: "mock provider,单测 / 离线开发用"


writer_routing:
  # 默认 profile:v1.0.x wave 6 s2.5 起切云端 dashscope Qwen Max；
  # 2026-08-16 活动模型已原位升级为 qwen3.8-max；随后按实际调用负载
  # 改为分层 thinking，默认 Writer 使用 medium creative profile。
  # 与 .env LLM_PROVIDER=openai_compatible 对齐,Router provider-mismatch
  # fallback 不再触发(原"主仓默认本地 + .env 云端"silent 不一致解除)。
  # 切回本地:需按 Agent 类型逐项改回相应 local_qwen_* profile，
  # 同步 .env 改 LLM_PROVIDER=ollama。
  default: cloud_qwen_max_medium_creative

  # Writer 特殊路由规则(原 PROJECT_SPEC §7 两条;v1.1 w4 B1 起 §7 已同步置空,见段末):
  # arc_finale 与高张力章升级 cloud_premium。维护人本机无 API key,
  # 命中时 Router provider-mismatch fallback 自动降级到 default
  # (cloud_qwen_max_medium_creative),不会因 ClaudeClient 缺 key 抛错。
  # v1.1 wave 4 acceptance(2026-06-02 维护人拍板):去掉"finale/高张力 → claude
  # 优先"遗留设计。维护人环境只有 dashscope、无 Claude key,这两条 cloud_premium
  # 规则原靠"无 key fallback"兜底,但 .env 里一个无效 CLAUDE_API_KEY(非空但 401)
  # 骗过 _is_provider_usable(只验非空不验有效)→ B1 ch-3(arc_finale)硬崩 401。
  # 维护人指示:"提供什么云端 API 就用什么",不需要高张力 claude 优先 → 清空规则,
  # finale/高张力章统一走 agent_routing.writer 默认
  # (cloud_qwen_max_medium_creative / dashscope)。
  # v1.1 wave 4 B1(2026-06-03 维护人拍板"全局移除"):从 acceptance 局部扶正为引擎默认 —
  # PROJECT_SPEC §7 + 本 config + test_config_yaml 三处同步置空 rules,引擎默认从此无
  # claude 优先(对齐维护人永久无 claude key 环境),任何书 finale 章不再撞 S1。
  rules: []

  # v1.0.x wave 6 s2.5(2026-05-25):agent_routing 全量切云端(创作 + 审稿
  # 全走 dashscope Qwen Max),保留 4 个"向量库相关"agent 配置层指向
  # 本地 profile。
  #
  # **v1.1 wave 2 H2(2026-05-28)起真混跑解锁** ✅(原 "运行时 Router
  # fallback 把这 4 个 silent 升级到云端 default" 约束已解除):Router 改按
  # API key 可用性判 fallback(详 src/core/routing/router.py:
  # _is_provider_usable),ollama 本地总可用 → 4 个 agent 真走本地 profile
  # 不被升级;工厂层 post-wave5 H1 已建多 provider 共存路径。
  #
  # **v1.1 wave 2 config-unify-cloud(2026-05-28)** ✅:14 个 agent **全量
  # 切云端** dashscope Qwen Max,**取消 4 个向量库相关 agent 的本地 ollama
  # 路径**。
  #
  # **v1.1 wave 2 thinking-fix-a(2026-05-28,本次修正)**:前一笔
  # config-unify-cloud 把 memory_extractor + continuity 隐式从"think 关"
  # (旧 local_qwen_safe `think: false`)改成"think 开"(cloud_qwen_max_thinking
  # `enable_thinking: true`),**未经维护人拍板**。维护人 push back 后选 A:
  # **严格只切 provider 不动 thinking** — 4 个向量库相关 agent 全切到
  # cloud_qwen_max_standard(thinking off,对齐旧 ollama think: false 行为)。
  # dashscope reasoning chars 账单不上升;真要 thinking on 单独议题拍板。
  #
  # **维护人动机**(本会话 + 修正):后续开发期 14 个 agent 行为统一可预测,
  # 避免不同 provider 间行为差异造成调试盲点;**thinking on/off 维持旧行为**
  # (本会话只切 provider,不隐式改 thinking)。
  # **切回本地混跑**:把下面 4 个 cloud_qwen_max_standard 改回 local_qwen_*
  # (memory_extractor / continuity / reranker → local_qwen_safe,
  # chapter_summary_extractor → local_qwen_32k),H2.5 真混跑解锁路径自动生效。
  # **2026-08-16 后继裁决**:上述 thinking-fix-a 是当时“只换 Provider”的历史
  # 边界；qwen3.8-max 独立评估获批后，当前活动语义路由已按真实负载显式
  # 分配 bounded xhigh / medium / low，且全部 preserve_thinking=false。
  # chapter_card_batch_by_beat 已退役，不再占活动 route/profile。
  # 与原 luo-cloud-test workspace 级 project.yaml 同款配置上调到引擎默认。
  agent_routing:
    # ==== v2 W3.5 任务A DeepSeek 生产路由回退(2026-07-04)====
    # active 生产路由一律回 Qwen，并按真实负载分 bounded xhigh / medium / low；
    # DeepSeek profile 保留为 parked 历史实验资产,但
    # 本段不得引用 cloud_deepseek_*。
    # 实证:v5 主流程第 4 章已暂停为 chapter_escalated / rewrite_budget_exhausted;
    # DeepSeek 持续破坏 must/forbidden/setting/style 等硬约束。
