# ===========================================================
# Reviewer 阈值配置(P6-B-13 引入)
# ===========================================================
#
# 工作区级默认 reviewer 阈值;工作区 project.yaml 可整段覆盖。
# 加载入口:src/services/config_service.py:ConfigService.load_reviewer_config
# 数据模型:src/core/models/reviewer_config.py:ReviewerConfig
#
# 与 ChapterCard 单章字段的关系
# ----------------------------
# ChapterCard.review_threshold / .revise_threshold 是单章级覆盖;本段是
# 工作区级默认。运行时优先级 ChapterCard > Workspace > Engine 留 P6-F-08+
# 接入(本任务只暴露端点 + service 方法,reviewer agent runtime 暂沿用
# ChapterCard 字段单一来源 — 启动指令字面接力 marker)。
#
# 字段说明
# - pass_threshold          : score_overall >= 即判 pass(对齐 ChapterCard
#                             review_threshold 默认 7.5)
# - revise_threshold        : revise_threshold <= score_overall < pass_threshold
#                             判 revise,低于判 rewrite(默认 6.5)
# - escalation_lower_bound  : 边界升 Claude 复审下界(闭区间)
#                             对齐 reviewer.py ESCALATION_LOWER_BOUND 默认 6.0
# - escalation_upper_bound  : 边界升 Claude 复审上界(闭区间)
#                             对齐 reviewer.py ESCALATION_UPPER_BOUND 默认 8.0

reviewer:
  # v1.0.x Commit D(2026-05-20 维护人拍板):pass/revise 默认线降低,与 bug ⑤
  # tension-aware 4 档 chapter_card 阈值带配合 — 工作区无 project.yaml 显式覆盖时,
  # _resolve_reviewer_thresholds 优先用 chapter_card 字段(tension-aware),
  # 这里的引擎默认仅作底层兜底(fixture 未填 chapter_card 字段时)。
  pass_threshold: 6.5
  revise_threshold: 5.5
  escalation_lower_bound: 6.0
  escalation_upper_bound: 8.0


# ===========================================================
# 检索 top_k 配置(P6-B-14 引入)
# ===========================================================
#
# 工作区级默认检索参数;工作区 project.yaml 可整段覆盖。
# 加载入口:src/services/config_service.py:ConfigService.load_retrieval_config
# 数据模型:src/core/models/retrieval_config.py:RetrievalConfig
#
# 与 caller 显式传参的关系
# ------------------------
# src/core/memory/retriever.py:retrieve_memories_for_chapter 默认 top_k=20;
# src/core/agents/writer.py:_build_retrieved_memory_section 显式传 top_k=10。
# 运行时优先级 caller > Workspace > Engine 留 P6-F-08+ 接入(本任务只暴露
# 端点 + service 方法,caller 链不动 — 启动指令字面接力 marker)。
#
# 字段说明
# - top_k          : 检索命中数上限,对齐 retriever DEFAULT_TOP_K 默认 20
# - min_similarity : 相似度下界(闭区间);0.0 = 不过滤(默认),> 0.0 时
#                    按 (1 - distance) >= min_similarity 过滤

retrieval:
  top_k: 20
  min_similarity: 0.0


# ===========================================================
# 生成参数配置(v1.1 wave 3 session 3 / L1 Q16 引入)
# ===========================================================
#
# 工作区级默认生成参数;工作区 project.yaml 可整段覆盖。
# 加载入口:src/services/config_service.py:ConfigService.load_generation_config
# 数据模型:src/core/models/generation_config.py:GenerationConfig
#
# 与 ChapterCard 单章字段的关系
# ----------------------------
# ChapterCard.word_count_min/max / .max_rewrites 是单章级值;本段是工作区级
# 默认。新生成章节卡时 ChapterCardService.derive_context 读本段作兜底
# (LLM 未给字数时用工作区默认而非 ChapterCard 模型默认);已生成的卡通过
# POST /workspaces/{id}/chapter-cards:reset-word-count(G6.2 backfill)应用。
#
# 字段说明
# - word_count_min/max : 当前默认 2500–3500，仍是 Writer 的正常任务要求。
# - word_count_policy_version : 2 为约数目标（min=max），1 为范围要求；均不按字数拒稿、扣分、压缩或补写；0 兼容旧活动。
#     下面的 2026-06-15 长度校准说明属于 v0 历史，不适用于当前 v1 写后策略：
#     docs/acceptance/v2_w3_s4_length_antistamp.md),故 5000 随 W3.5 cutover 一起落。
# - max_rewrites   : 新生成章节卡整章重写次数上限默认(对齐 ChapterCard 默认 3)
#
# 注:temperature 不在本段 —— 它归 v1.1 I 类写作风格模板系统(I2)按风格
# 分工种智能设置;L1 一刀切覆盖会与 I2 重复 / 冲突,故 L1 不做 temperature。

generation:
  # 2026-10-02 维护人批准：篇幅要求与其他任务同权重，写后不作字数硬拦截。
  word_count_min: 2000
  word_count_max: 2000
  word_count_policy_version: 2
  max_rewrites: 3
  core_state_hard_enabled: true  # post-v6 Session 3/C；关闭时新卡沿用 legacy v0，不自动回填


# ── 模型校准 profile(W3.5-s2 引入)────────────────────────────────────────
# 三层架构(plan §1)的 **③ 模型校准层**:一套 robust 机制(①②层)+ **每模型一组
# 实测数字**。校准套件 scripts/v2_w3_5_s2_calibration_suite.py 喂固定语料实测后产出;
# 引擎按 **模型名**(非 profile id;多 profile 共享同模型校准)load。
# 消费方:s3 拆章读 per_genre[原型].chars_per_beat / s5 路由+UI 按 model id load(未命中警告)。
# loader = src/core/config_loader.load_model_calibration;schema = ModelCalibration。
# 工作区 project.yaml 可整段覆盖(同 routing 语义);段缺失 = 优雅空(消费方按 model 警告)。
model_calibration:
  # qwen3.8-max 长度校准（W3.5-R9 v6 §2.143，2026-08-17 本地活动；
  # result calibrated_at 使用 UTC 日期 2026-08-16）。12 个当前 Writer v19 新样本，
  # medium thinking 16K、preserve_thinking=false；报告见
  # docs/acceptance/v2_w3_5_r9_qwen38_length_calibration_v1_completion_report.md。
  qwen3.8-max:
    calibrated_at: "2026-08-16"
    calibration_corpus: "length-only fresh Writer v19 outputs; heal-off-v1 + luo-accept-v2 fixed cards ch-0004..0009 (6+6)"
    global:
      length_tendency: balanced       # 12 章仅 2 章 >5000；不系统性开启超长 trim
      anti_stamp_strength: medium     # regex high 仅诊断；无真人/Reviewer 证据，不自动开启 anti-tic trim
      recommended_temperature: 0.85  # 保持当前 Writer profile 温度；治愈语料仍按风格覆盖 0.75
      thinking_default: true          # 保持当前 Writer medium thinking 16K
      reviewer_threshold_adjustment: 0.0  # 本活动未调用 Reviewer；中性保留，不冒充阈值校准
    per_genre:
      introspection:
        chars_per_beat: 1352          # 4056 / 3 个 plot_node_budget 内容单元
        chars_per_chapter: 4056
        length_compliance: 0.667      # ≤5000 为 4/6
        content_units_per_chapter: 3.0
        sample_chapters: 6
      action:
        chars_per_beat: 1088          # 3265 / 3 个 plot_node_budget 内容单元
        chars_per_chapter: 3265
        length_compliance: 1.0        # ≤5000 为 6/6
        content_units_per_chapter: 3.0
        sample_chapters: 6

  # deepseek-v4-pro 首基线(W3.5-s2,2026-06-16)
  # 来源:固定语料 modelab_drafts 离线实测(长度/守闸/tell密度,零 LLM 可复现)+
  #   reviewer 兼容真 LLM(W3.5-s2 批准点①,deepseek tight v12 臂 12/12 pass、漂移
  #   introspection +0.13 / action +0.00 ≥ qwen 基线 8.54/8.49,成本 $1.348)。
  # 报告:docs/acceptance/v2_w3_5_s2_calibration_deepseek-v4-pro_*.md。
  deepseek-v4-pro:
    calibrated_at: "2026-06-16"
    calibration_corpus: "heal-off-v1 + luo-accept-v2 modelab_drafts(各 6 章,deepseek w3s4_tight v12 臂)"
    global:
      length_tendency: overshoot      # 守闸率得到:多数动作章超 5000(deepseek 偏写长;qwen 偏 undershoot)
      anti_stamp_strength: high       # 权威依据 = w3-s3/w3-s4 读者盲读(~10-20% tell残留);regex 支撑(未处理峰值 0.44 > qwen 0.29)
      recommended_temperature: 0.85   # cloud_deepseek_v4_pro standard 温度锚
      thinking_default: false         # writer/生成路径;outline/card/judge 走 _thinking 兄弟 profile(镜像 qwen 方针)
      reviewer_threshold_adjustment: 0.0  # W3.5-s2 真 LLM 确认:deepseek 12/12 pass、漂移 ≥0(+0.13/+0.00)→ 无需降阈
    per_genre:
      introspection:                  # heal 型(治愈/内省):tell 长 show 短,chars/beat 低 → s3 不触发额外拆章
        chars_per_beat: 1534          # = chars_per_chapter / content_units(4602/3)
        chars_per_chapter: 4602       # 实测均值(deepseek v12 tight 臂)
        length_compliance: 0.667      # ≤5000 守闸率(4/6)
        content_units_per_chapter: 3.0  # plot_node_budget 实测恒定
        sample_chapters: 6
      action:                         # luo 型(动作/悬疑):show 是逐招演出,chars/beat 高 → s3 触发拆章
        chars_per_beat: 1788          # = 5364/3
        chars_per_chapter: 5364       # 实测均值;> 5000 → 动作题材系统性超闸(w3-s4 题材长度反号发现)
        length_compliance: 0.333      # ≤5000 守闸率(2/6)→ s3 拆章靶子
        content_units_per_chapter: 3.0
        sample_chapters: 6
